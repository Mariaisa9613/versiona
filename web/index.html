<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="versiona">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>versiona</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    OCR de tickets/facturas en web (ver lib/services/ticket_ocr_web.dart).
    Este script es el propio de Versiona (no una CDN de terceros); la
    imagen del ticket se procesa entera en el navegador vía WebAssembly y
    nunca sale de él. Este fichero solo carga el punto de entrada: el motor
    WASM y los datos de idioma (varios MB) se piden a la CDN oficial de
    Tesseract.js la primera vez que se usa, no en cada carga de la página.
  -->
  <script src="tesseract/tesseract.min.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
