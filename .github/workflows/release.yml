name: Release build

# Compila Versiona para macOS y Windows en cada push a main y publica los
# .zip resultantes en una única release "build-latest" que se sobrescribe
# cada vez (no es una versión etiquetada de verdad, es el punto de descarga
# de la última compilación funcional).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.29.0"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Empaquetar la app en zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/Versiona-macOS.zip" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: Versiona-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Empaquetar la app en zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Versiona-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Versiona-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
      - name: Mover el tag "build-latest" al commit actual
        run: |
          git tag -f build-latest
          git push -f origin build-latest
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: "Última compilación automática"
          body: |
            Compilación automática generada desde el commit ${{ github.sha }}.
            No es una versión estable etiquetada: se sobrescribe en cada push a `main`.
          prerelease: true
          files: |
            Versiona-macOS.zip
            Versiona-Windows.zip
